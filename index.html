<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>京都市会 AR Camera Test No.011</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;background:#000;color:#fff}
#app{position:relative;width:100%;height:100dvh;overflow:hidden}
video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#111}
.overlay{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.25),rgba(0,0,0,.05) 40%,rgba(0,0,0,.75));pointer-events:none}
.top{position:absolute;z-index:3;top:0;left:0;right:0;padding:calc(14px + env(safe-area-inset-top)) 16px}
.title{font-weight:700;font-size:18px}
.sub{font-size:12px;opacity:.8;margin-top:4px}
.marker{position:absolute;z-index:3;top:26%;left:50%;transform:translateX(-50%);text-align:center}
.star{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;margin:auto;border:1px solid rgba(255,230,109,.9);background:rgba(255,230,109,.12);font-size:34px;color:#ffe66d}
.name{font-weight:700;margin-top:10px;text-shadow:0 2px 8px #000}
.panel{position:absolute;z-index:5;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));background:rgba(10,14,20,.82);border:1px solid rgba(255,255,255,.2);border-radius:20px;padding:14px;backdrop-filter:blur(16px)}
button{width:100%;border:0;border-radius:14px;padding:14px;font:inherit;font-weight:700;background:#ffe66d;color:#111}
button.secondary{margin-top:8px;background:rgba(255,255,255,.10);color:#fff;border:1px solid rgba(255,255,255,.18)}
#status{font-size:13px;line-height:1.55;margin-bottom:10px;white-space:pre-wrap}
.ok{color:#b9f6c8}.bad{color:#ffb6b6}
.info{display:none;margin-top:12px;padding-top:12px;border-top:1px solid rgba(255,255,255,.16)}
.info.show{display:block}
.info h2{font-size:18px;margin:0 0 8px}
.info p{font-size:14px;line-height:1.6;margin:0}
.source{display:block;margin-top:10px;color:#fff;font-size:13px}
</style>
</head>
<body>
<div id="app">
  <video id="camera" autoplay playsinline muted></video>
  <div class="overlay"></div>

  <div class="top">
    <div class="title">街の議論をひらく</div>
    <div class="sub">京都市会 AR / Camera Test No.011</div>
  </div>

  <div class="marker">
    <div class="star">✦</div>
    <div class="name">京都市立芸術大学</div>
  </div>

  <div class="panel">
    <div id="status">カメラの状態を確認中…</div>
    <button id="startBtn">カメラを開始</button>
    <button class="secondary" id="infoBtn">芸大の説明を見る</button>

    <div class="info" id="info">
      <h2>京都市立芸術大学の移転整備</h2>
      <p>京都市立芸術大学の移転をめぐっては、老朽化・狭あい化した教育環境の改善に加え、崇仁地域への移転を京都駅東部の活性化につなげることが議論されました。文化芸術を国内外へ発信する拠点、市民と大学が交流する場を目指す一方、事業費、地域との連携、移転後の洛西地域の活性化なども論点となりました。</p>
      <a class="source" href="https://ssp.kaigiroku.net/tenant/kyoto/MinuteView.html?council_id=3220&schedule_id=1&is_search=true" target="_blank" rel="noopener">出典：2014年1月20日 経済総務委員会</a>
    </div>
  </div>
</div>

<script>
const camera = document.getElementById('camera');
const startBtn = document.getElementById('startBtn');
const status = document.getElementById('status');
const info = document.getElementById('info');
const infoBtn = document.getElementById('infoBtn');

function preflight(){
  const secure = window.isSecureContext;
  const hasMediaDevices = !!navigator.mediaDevices;
  const hasGUM = !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia);

  status.textContent =
    `HTTPS/安全な接続: ${secure ? 'OK' : 'NG'}\n` +
    `mediaDevices: ${hasMediaDevices ? 'OK' : 'NG'}\n` +
    `getUserMedia: ${hasGUM ? 'OK' : 'NG'}`;

  status.className = (secure && hasGUM) ? 'ok' : 'bad';
}
preflight();

startBtn.addEventListener('click', async () => {
  startBtn.disabled = true;
  status.className = '';
  status.textContent = 'カメラ権限を要求しています…';

  try {
    if (!window.isSecureContext) {
      throw new Error('このページがHTTPSで開かれていません。GitHub Pagesの https:// のURLをSafariで開いてください。');
    }
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      throw new Error('このブラウザではカメラAPIが利用できません。iPhoneのSafari本体で開いてください。');
    }

    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'environment' },
      audio: false
    });

    camera.srcObject = stream;
    await camera.play();

    status.textContent = 'カメラ起動：OK';
    status.className = 'ok';
    startBtn.textContent = 'カメラ起動済み';
  } catch (err) {
    let msg = `${err.name || 'Error'}: ${err.message || err}`;

    if (err.name === 'NotAllowedError') {
      msg += '\n\nカメラ権限が拒否されています。Safariの「Webサイトの設定」→「カメラ」を「許可」にして、ページを再読み込みしてください。';
    } else if (err.name === 'NotFoundError') {
      msg += '\n\n利用できるカメラが見つかりません。';
    } else if (err.name === 'NotReadableError') {
      msg += '\n\n他のアプリがカメラを使用している可能性があります。カメラアプリ等を終了して再試行してください。';
    }

    status.textContent = msg;
    status.className = 'bad';
    startBtn.disabled = false;
  }
});

infoBtn.addEventListener('click', () => {
  info.classList.toggle('show');
  infoBtn.textContent = info.classList.contains('show') ? '説明を閉じる' : '芸大の説明を見る';
});
</script>
</body>
</html>
